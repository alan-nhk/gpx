<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的專屬越野路線圖</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: sans-serif; margin: 20px; text-align: center; }
        .btn-group { margin-top: 15px; margin-bottom: 15px; }
        .btn {
            background-color: #D31145; color: white;
            padding: 10px 20px; border: none; border-radius: 5px;
            cursor: pointer; font-size: 16px; margin: 0 5px;
        }
        .btn:hover { background-color: #b00e39; }
        #stats-container {
            display: flex; justify-content: center; gap: 20px; margin-top: 20px;
            font-size: 18px; font-weight: bold; color: #513D47;
            background-color: #f9f9f9; padding: 15px; border-radius: 8px;
        }
        .stat-item span { color: #D31145; font-size: 24px; }
        #map { height: 400px; width: 100%; margin-top: 20px; border-radius: 8px; }
        #chart-container { width: 100%; margin-top: 20px; background: white; padding: 10px; }
    </style>
</head>
<body>

    <h2>上傳 GPX 檔案查看路線與海拔</h2>
    
    <div class="btn-group">
        <input type="file" id="gpxFileInput" accept=".gpx" class="btn" style="background-color: #513D47;">
        <button class="btn" onclick="exportMap()">匯出地圖</button>
        <button class="btn" onclick="exportChart()">匯出海拔圖</button>
    </div>

    <div id="stats-container" style="display: none;">
        <div class="stat-item">總距離: <span id="total-dist">0</span> km</div>
        <div class="stat-item">總攀升: <span id="total-asc">0</span> m</div>
        <div class="stat-item">總下降: <span id="total-desc">0</span> m</div>
    </div>

    <div id="map"></div>
    <div id="chart-container">
        <canvas id="elevationChart"></canvas>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

    <script>
        let map = L.map('map').setView([22.3193, 114.1694], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap',
            crossOrigin: true // 允許跨域，這樣才能匯出地圖圖片
        }).addTo(map);

        let polyline;
        let elevationChart;

        // 計算兩點之間的地球表面距離 (Haversine formula)
        function calcDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // 地球半徑(公里)
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        document.getElementById('gpxFileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                parseGPX(event.target.result);
            };
            reader.readAsText(file);
        });

        function parseGPX(gpxText) {
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(gpxText, "text/xml");
            const trkpts = xmlDoc.getElementsByTagName("trkpt");
            
            let latlngs = [];
            let elevations = [];
            let labels = [];
            let hasElevationData = false;
            
            let totalDist = 0;
            let totalAsc = 0;
            let totalDesc = 0;

            for (let i = 0; i < trkpts.length; i++) {
                let lat = parseFloat(trkpts[i].getAttribute("lat"));
                let lon = parseFloat(trkpts[i].getAttribute("lon"));
                let eleNode = trkpts[i].getElementsByTagName("ele")[0];
                let ele = 0;
                
                if (eleNode && eleNode.textContent) {
                    ele = parseFloat(eleNode.textContent);
                    hasElevationData = true; 
                }

                latlngs.push([lat, lon]);
                elevations.push(ele);
                labels.push(i);

                // 從第二個點開始計算距離與高度差
                if (i > 0) {
                    let prevLat = parseFloat(trkpts[i-1].getAttribute("lat"));
                    let prevLon = parseFloat(trkpts[i-1].getAttribute("lon"));
                    totalDist += calcDistance(prevLat, prevLon, lat, lon);

                    if (hasElevationData) {
                        let prevEle = elevations[i-1];
                        let eleDiff = ele - prevEle;
                        if (eleDiff > 0) totalAsc += eleDiff;
                        else if (eleDiff < 0) totalDesc += Math.abs(eleDiff);
                    }
                }
            }

            // 更新畫面上的統計數據
            document.getElementById('stats-container').style.display = 'flex';
            document.getElementById('total-dist').innerText = totalDist.toFixed(2);
            document.getElementById('total-asc').innerText = Math.round(totalAsc);
            document.getElementById('total-desc').innerText = Math.round(totalDesc);

            drawMap(latlngs);

            if (!hasElevationData && trkpts.length > 0) {
                alert("溫馨提示：這個 GPX 檔案裡沒有包含海拔數據。海拔圖與總攀升將顯示為 0。");
            }
            drawChart(labels, elevations);
        }

        function drawMap(latlngs) {
            if (polyline) map.removeLayer(polyline);
            polyline = L.polyline(latlngs, {color: '#513D47', weight: 4}).addTo(map);
            map.fitBounds(polyline.getBounds());
        }

        function drawChart(labels, elevations) {
            const ctx = document.getElementById('elevationChart').getContext('2d');
            if (elevationChart) elevationChart.destroy();
            
            // 加上白色背景，確保匯出圖片時不會變透明黑底
            Chart.plugins.register({
                beforeDraw: function(chartInstance) {
                    var ctx = chartInstance.chart.ctx;
                    ctx.fillStyle = "white";
                    ctx.fillRect(0, 0, chartInstance.chart.width, chartInstance.chart.height);
                }
            });

            elevationChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '海拔高度 (m)',
                        data: elevations,
                        borderColor: '#D31145',
                        backgroundColor: 'rgba(211, 17, 69, 0.2)',
                        borderWidth: 2,
                        fill: true,
                        pointRadius: 0
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        x: { display: false },
                        y: { title: { display: true, text: '海拔 (m)' } }
                    }
                }
            });
        }

        // 匯出地圖圖片功能
        function exportMap() {
            html2canvas(document.getElementById('map'), {
                useCORS: true, // 允許載入 OpenStreetMap 圖磚
                allowTaint: false
            }).then(canvas => {
                let link = document.createElement('a');
                link.download = 'my_trail_map.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        // 匯出海拔圖圖片功能
        function exportChart() {
            let link = document.createElement('a');
            link.download = 'my_elevation_chart.png';
            link.href = document.getElementById('elevationChart').toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
