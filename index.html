<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的專屬越野路線圖</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: sans-serif; margin: 15px; text-align: center; background-color: #ffffff; }
        .btn-group { margin: 15px 0; }
        .btn { 
            background-color: #D31145; color: white; padding: 10px 15px; 
            border: none; border-radius: 5px; cursor: pointer; 
            font-size: 14px; margin: 5px; 
        }
        .btn:hover { background-color: #b00e39; }
        #stats-container { 
            display: flex; justify-content: center; gap: 15px; margin-top: 15px; 
            font-size: 16px; font-weight: bold; color: #513D47; 
            background-color: #f9f9f9; padding: 15px; border-radius: 8px; flex-wrap: wrap; 
        }
        .stat-item span { color: #D31145; font-size: 20px; }
        #map { height: 400px; width: 100%; margin-top: 15px; border-radius: 8px; z-index: 1; }
        #chart-container { width: 100%; margin-top: 15px; background: white; padding: 10px; box-sizing: border-box; }
    </style>
</head>
<body>
    <h2>上傳 GPX 檔案查看路線與海拔</h2>
    
    <div class="btn-group">
        <input type="file" id="gpxFileInput" accept=".gpx" class="btn" style="background-color: #513D47;">
        <button class="btn" onclick="exportMap()">匯出地圖</button>
        <button class="btn" onclick="exportChart()">匯出海拔圖</button>
    </div>
    
    <div id="stats-container" style="display: none;">
        <div class="stat-item">總距離: <span id="total-dist">0</span> km</div>
        <div class="stat-item">總攀升: <span id="total-asc">0</span> m</div>
        <div class="stat-item">總下降: <span id="total-desc">0</span> m</div>
    </div>
    
    <div id="map"></div>
    <div id="chart-container">
        <canvas id="elevationChart"></canvas>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <script>
        // 確保網頁基礎架構載入後，才開始執行功能，避免白畫面
        document.addEventListener("DOMContentLoaded", function() {
            let map = L.map('map', {preferCanvas: true}).setView([22.3193, 114.1694], 11);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { 
                attribution: '© OpenStreetMap', 
                crossOrigin: 'anonymous' 
            }).addTo(map);

            let polyline;
            let elevationChart;

            function calcDistance(lat1, lon1, lat2, lon2) {
                const R = 6371;
                const dLat = (lat2 - lat1) * Math.PI / 180;
                const dLon = (lon2 - lon1) * Math.PI / 180;
                const a = Math.sin(dLat/2) * Math.sin(dLat/2) + 
                          Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                return R * c;
            }

            document.getElementById('gpxFileInput').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(event) { parseGPX(event.target.result); };
                reader.readAsText(file);
            });

            function parseGPX(gpxText) {
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(gpxText, "text/xml");
                const trkpts = xmlDoc.getElementsByTagName("trkpt");
                let latlngs = [], elevations = [], labels = [];
                let hasElevationData = false, totalDist = 0, totalAsc = 0, totalDesc = 0;
                
                for (let i = 0; i < trkpts.length; i++) {
                    let lat = parseFloat(trkpts[i].getAttribute("lat"));
                    let lon = parseFloat(trkpts[i].getAttribute("lon"));
                    let eleNode = trkpts[i].getElementsByTagName("ele")[0];
                    let ele = 0;
                    if (eleNode && eleNode.textContent) {
                        ele = parseFloat(eleNode.textContent);
                        hasElevationData = true; 
                    }
                    latlngs.push([lat, lon]);
                    elevations.push(ele);
                    labels.push(i);
                    
                    if (i > 0) {
                        let prevLat = parseFloat(trkpts[i-1].getAttribute("lat"));
                        let prevLon = parseFloat(trkpts[i-1].getAttribute("lon"));
                        totalDist += calcDistance(prevLat, prevLon, lat, lon);
                        if (hasElevationData) {
                            let prevEle = elevations[i-1];
                            let eleDiff = ele - prevEle;
                            if (eleDiff > 0) totalAsc += eleDiff;
                            else if (eleDiff < 0) totalDesc += Math.abs(eleDiff);
                        }
                    }
                }
                
                document.getElementById('stats-container').style.display = 'flex';
                document.getElementById('total-dist').innerText = totalDist.toFixed(2);
                document.getElementById('total-asc').innerText = Math.round(totalAsc);
                document.getElementById('total-desc').innerText = Math.round(totalDesc);
                
                drawMap(latlngs);
                
                if (!hasElevationData && trkpts.length > 0) {
                    alert("溫馨提示：這個 GPX 檔案裡沒有包含海拔數據。海拔圖與總攀升將顯示為 0。");
                }
                drawChart(labels, elevations);
            }

            function drawMap(latlngs) {
                if (polyline) map.removeLayer(polyline);
                polyline = L.polyline(latlngs, {color: '#513D47', weight: 4}).addTo(map);
                map.fitBounds(polyline.getBounds());
            }

            const customCanvasBackgroundColor = {
                id: 'customCanvasBackgroundColor',
                beforeDraw: (chart, args, options) => {
                    const {ctx} = chart;
                    ctx.save();
                    ctx.globalCompositeOperation = 'destination-over';
                    ctx.fillStyle = options.color || 'white';
                    ctx.fillRect(0, 0, chart.width, chart.height);
                    ctx.restore();
                }
            };

            function drawChart(labels, elevations) {
                const ctx = document.getElementById('elevationChart').getContext('2d');
                if (elevationChart) elevationChart.destroy();
                elevationChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: '海拔高度 (m)',
                            data: elevations,
                            borderColor: '#D31145',
                            backgroundColor: 'rgba(211, 17, 69, 0.2)',
                            borderWidth: 2,
                            fill: true,
                            pointRadius: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        scales: { x: { display: false }, y: { title: { display: true, text: '海拔 (m)' } } },
                        plugins: { customCanvasBackgroundColor: { color: 'white' } }
                    },
                    plugins: [customCanvasBackgroundColor]
                });
            }

            // 綁定匯出按鈕功能到全域，確保按鈕點擊有效
            window.exportMap = function() {
                html2canvas(document.getElementById('map'), {
                    useCORS: true,
                    allowTaint: false,
                    backgroundColor: null
                }).then(canvas => {
                    let link = document.createElement('a');
                    link.download = 'my_trail_map.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                }).catch(err => {
                    console.error('匯出失敗', err);
                    alert('匯出地圖時發生錯誤，請稍後再試。');
                });
            };

            window.exportChart = function() {
                let link = document.createElement('a');
                link.download = 'my_elevation_chart.png';
                link.href = document.getElementById('elevationChart').toDataURL('image/png');
                link.click();
            };
        });
    </script>
</body>
</html>
